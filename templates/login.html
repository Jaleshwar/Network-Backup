<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Network Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );
        }

        .login-box{

            width:400px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 10px 30px rgba(0,0,0,0.3);

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .login-box h1{

            text-align:center;

            margin-bottom:10px;

            color:#0f172a;
        }

        .login-box p{

            text-align:center;

            color:gray;

            margin-bottom:30px;
        }

        .input-box{

            margin-bottom:20px;
        }

        .input-box input{

            width:100%;

            padding:14px;

            border:1px solid #ccc;

            border-radius:10px;

            outline:none;

            transition:0.3s;
        }

        .input-box input:focus{

            border-color:#2563eb;

            box-shadow:0 0 10px rgba(37,99,235,0.3);
        }

        .login-btn{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{

            background:#1d4ed8;
        }

        .links{

            margin-top:20px;

            display:flex;

            justify-content:space-between;
        }

        .links a{

            text-decoration:none;

            color:#2563eb;

            font-size:14px;
        }

        .links a:hover{

            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Welcome Back</h1>

    <p>Login to Network Dashboard</p>

    <form method="POST">

        <div class="input-box">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>

        </div>

        <div class="input-box">

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

        </div>

        <button class="login-btn"
                type="submit">

            Login

        </button>

    </form>

    <div class="links">

        <a href="/forgot-password">
            Forgot Password?
        </a>

        <a href="/register">
            Register
        </a>

    </div>

</div>

</body>
</html>
