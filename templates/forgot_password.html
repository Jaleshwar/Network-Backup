<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>

        body{

            margin:0;

            height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:
            linear-gradient(
                135deg,
                #1e293b,
                #2563eb
            );

            font-family:Arial;
        }

        .forgot-box{

            width:400px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        h1{

            text-align:center;

            margin-bottom:25px;
        }

        input{

            width:100%;

            padding:14px;

            border-radius:10px;

            border:1px solid #ccc;

            margin-bottom:20px;
        }

        button{

            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;
        }

        a{

            display:block;

            text-align:center;

            margin-top:20px;

            text-decoration:none;

            color:#2563eb;
        }

    </style>

</head>

<body>

<div class="forgot-box">

    <h1>Forgot Password</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter Registered Email"
               required>

        <button type="submit">
            Reset Password
        </button>

    </form>

    <a href="/login">
        Back to Login
    </a>

</div>

</body>
</html>
